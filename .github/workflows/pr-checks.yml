name: PigMasterUI PR Checks

on:
  pull_request:
    paths:
      - 'PigMasterUI/**'
      - '.github/workflows/pr-checks.yml'
  push:
    branches: [main, master]
    paths:
      - 'PigMasterUI/**'
      - '.github/workflows/pr-checks.yml'

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PigMasterUI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: PigMasterUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PigMasterUI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: PigMasterUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx next lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    defaults:
      run:
        working-directory: PigMasterUI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: PigMasterUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build