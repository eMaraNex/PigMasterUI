name: Deploy UI - Live (main)

on:
  workflow_dispatch:

concurrency:
  group: ui-deploy-live
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (types + build)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_CURRENCY: ${{ secrets.NEXT_PUBLIC_BASE_CURRENCY }}

  deploy:
    name: Deploy to VPS
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            echo "Running as $(whoami) with node $(node -v)"
            cd /var/www/PigMasterUI
            git fetch --prune origin main
            git reset --hard origin/main
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "Server is now on $DEPLOYED_SHA"
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "Expected ${{ github.sha }} but server has $DEPLOYED_SHA"
              exit 1
            fi
            npm ci
            npm run build
            pm2 restart pigmasterui --update-env
            pm2 save
            pm2 list