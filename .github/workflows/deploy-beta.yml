name: Deploy UI — Beta (beta)

on:
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: ui-deploy-beta
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_CURRENCY: ${{ secrets.NEXT_PUBLIC_BASE_CURRENCY }}

  deploy:
    name: Deploy to VPS
    needs: checks
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 20
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd /var/www/PigMasterUIBeta
            git fetch origin beta
            git reset --hard origin/beta
            npm ci
            npm run build
            pm2 restart pigmasterui-beta --update-env
            pm2 save